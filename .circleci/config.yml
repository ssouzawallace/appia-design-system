# CircleCI configuration for AppiaCare Design System
# Validates documentation (Markdown) on each push.
version: 2.1

jobs:
  validate-docs:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Install markdownlint
          command: npm install -g markdownlint-cli
      - run:
          name: Lint Markdown files
          command: markdownlint '**/*.md' --ignore node_modules
      - run:
          name: Check for broken image references
          command: |
            missing=0
            for img in $(grep -o '!\[[^]]*\]([^)]*)' README.md | sed 's/.*](//' | sed 's/)$//'); do
              if [ ! -f "$img" ]; then
                echo "ERROR: Missing image referenced in README.md: $img"
                missing=1
              fi
            done
            exit "$missing"

workflows:
  docs:
    jobs:
      - validate-docs
